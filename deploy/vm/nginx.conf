server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # A location with its own add_header drops the server-level ones, so every
  # location below sets the full set itself.
  # YouTube embeds (background music) refuse to play without a referrer (error 153),
  # hence strict-origin-when-cross-origin rather than no-referrer.

  # The page, the service worker and the card / bonus data must always be checked for a new version
  # (without a Cache-Control the browser may guess a freshness time for the .json files).
  location = / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }
  location ~ ^/(index\.html|sw\.js|[a-z-]+\.json)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  # Two-device rooms: WebSocket relay (relay/relay.js) in the fai-rak-relay container.
  # Resolved per request so nginx still starts while the relay is restarting.
  location = /ws {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $relay http://relay:8080;
    proxy_pass $relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location ~ /\. { deny all; }
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
}
