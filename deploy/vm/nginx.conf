server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # A location with its own add_header drops the server-level ones, so every
  # location below sets the full set itself.
  # YouTube embeds (background music) refuse to play without a referrer (error 153),
  # hence strict-origin-when-cross-origin rather than no-referrer.

  # The page and the service worker must always be checked for a new version.
  location = / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }
  location ~ ^/(index\.html|sw\.js)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location ~ /\. { deny all; }
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
}
