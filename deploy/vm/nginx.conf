server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  location = /manifest.webmanifest { default_type application/manifest+json; add_header X-Robots-Tag "noindex, nofollow" always; }

  add_header X-Content-Type-Options nosniff always;
  # YouTube embeds (background music) refuse to play without a referrer (error 153).
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # The service worker and the page must always be checked for a new version.
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = / { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; try_files /index.html =404; }

  location / { try_files $uri =404; }
  location ~ /\. { deny all; }
}
