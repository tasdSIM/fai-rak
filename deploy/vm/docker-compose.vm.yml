# VM only (cpxsim, /opt/fai-rak). deploy/deploy-vm.sh copies this to the app folder.
#
# Wholly apart from every other stack on the VM: its own project (fai-rak-prod), network,
# containers, loopback port, and its own Cloudflare tunnel "fai-rak", whose route
# fairuk.cpxsim.online -> http://fai-rak:80 is set in the Cloudflare dashboard.
# The tunnel token is in /opt/fai-rak/tunnel.env on the VM (never in this folder).
name: fai-rak-prod

services:
  fai-rak:
    image: nginx:alpine
    container_name: fai-rak-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Loopback only, for the deploy script's health check.
      # 8080 CPX, 8090 Coding Adventure, 8091 ARMY-INTEL, 8092 exec-scheduler.
      - "127.0.0.1:8093:80"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  relay:
    # Two-device rooms (WebSocket). No dependencies, nothing on disk; nginx proxies /ws here.
    image: node:22-alpine
    container_name: fai-rak-relay
    restart: unless-stopped
    command: ["node", "/app/relay.js"]
    user: node
    read_only: true
    environment:
      ALLOWED_ORIGINS: https://fairuk.cpxsim.online
    volumes:
      - ./relay.js:/app/relay.js:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: fai-rak-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: tunnel.env
    depends_on: [fai-rak]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
